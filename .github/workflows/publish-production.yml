name: Publish production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Site workflow run ID to promote (already published to staging)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote tested staging build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.infovore-labs.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the source run and staging deployment
        id: source
        env:
          RUN_ID: ${{ inputs.staging_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-promotion.mjs
      - name: Download the exact tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish to both production domains
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make deploy-production
      - name: Record the published source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          printf 'Published commit `%s` from staging run [%s](https://github.com/%s/actions/runs/%s).\n' "$SOURCE_SHA" "$SOURCE_RUN" "$GITHUB_REPOSITORY" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
