services:
  guest-builder:
    build: ./guest
    volumes:
      - .:/project
      - guest-cache-verified-v1:/build
    working_dir: /project
    command: ["sh", "guest/build.sh"]
volumes:
  # Retire all pre-verification cache state, including compiled dependencies.
  # Do not migrate old source trees or binaries into this volume.
  guest-cache-verified-v1:
