<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0b">
  <meta name="description" content="William Michael Turner — site reliability, platform, and infrastructure engineering. Experience, skills, and education.">
  <title>William Michael Turner / Résumé</title>
  <script>try{const t=localStorage.getItem('personal-space-theme');if(['solarized-dark','solarized-light','nord','dracula','gruvbox'].includes(t))document.documentElement.dataset.theme=t;}catch{}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{style}}">
  <link rel="stylesheet" href="{{resumeStyle}}">
  <script type="module" src="{{offline}}"></script>
</head>
<body class="resume-page">
  <a class="skip-link" href="#resume">Skip to résumé</a>
  <main class="resume-shell">
    <nav class="resume-toolbar" aria-label="Résumé actions"><a href="./#work" data-return-terminal>← Back to terminal</a><a class="resume-download" href="resume.pdf" download="William-Turner-Resume.pdf">Download PDF <span aria-hidden="true">↓</span></a></nav>
    <article class="resume-paper" id="resume" aria-label="Résumé">
      {{resume}}
      <footer class="resume-colophon"><a href="#overview">Back to top ↑</a><a href="THIRD_PARTY_NOTICES.txt">Credits</a></footer>
    </article>
    <p class="resume-end">PERSONAL / SPACE <span aria-hidden="true">·</span> <a href="./#work" data-return-terminal>Return to the terminal</a></p>
  </main>
</body>
</html>
